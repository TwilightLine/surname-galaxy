<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>百家姓 · 来时路 — 输入你的姓，看你祖先走过的三千年</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", serif;
    background: radial-gradient(ellipse at 50% 120%, #0d1b2e 0%, #060a14 55%, #030509 100%);
    color: #e8dcc0;
    -webkit-font-smoothing: antialiased;
  }
  #sky { position: fixed; inset: 0; display: block; }
  #starfield { position: fixed; inset: 0; display: block; }

  /* ---------- 顶部标题 ---------- */
  .masthead {
    position: fixed; top: 4vh; left: 0; right: 0;
    text-align: center; pointer-events: none; z-index: 5;
    transition: opacity .8s ease, transform .8s ease;
  }
  .masthead .sub {
    font-size: clamp(11px, 1.6vw, 14px); letter-spacing: .55em; text-indent: .55em;
    color: #8fa3c2; margin-bottom: 1.2vh;
  }
  .masthead h1 {
    font-size: clamp(30px, 5.4vw, 58px); font-weight: 600;
    letter-spacing: .22em; text-indent: .22em;
    background: linear-gradient(180deg, #f5e7c1 0%, #d8b877 55%, #a8823f 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 46px rgba(216,184,119,.25);
  }
  .masthead .tagline {
    margin-top: 1.6vh; font-size: clamp(13px, 1.9vw, 17px);
    color: #b9c6da; letter-spacing: .28em; text-indent: .28em;
  }
  body.detail-open .masthead { opacity: 0; transform: translateY(-24px); }

  /* ---------- 搜索 ---------- */
  .searchwrap {
    position: fixed; left: 50%; bottom: 13vh; transform: translateX(-50%);
    z-index: 6; width: min(560px, 86vw);
    transition: opacity .6s ease, transform .6s ease;
  }
  body.detail-open .searchwrap { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(30px); }
  .searchbox {
    display: flex; align-items: center; gap: 12px;
    background: rgba(10, 16, 30, .72);
    border: 1px solid rgba(216,184,119,.35);
    border-radius: 999px; padding: 14px 26px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 44px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .searchbox .icon { font-size: 19px; color: #d8b877; opacity: .9; }
  .searchbox input {
    flex: 1; background: none; border: none; outline: none;
    color: #f0e6cf; font-family: inherit;
    font-size: clamp(16px, 2.4vw, 21px); letter-spacing: .12em;
  }
  .searchbox input::placeholder { color: #6d7d95; letter-spacing: .1em; }
  .hint {
    margin-top: 14px; text-align: center; font-size: clamp(11px, 1.5vw, 13px);
    color: #77879f; letter-spacing: .2em; text-indent: .2em;
  }
  .hint b { color: #c8ab6d; font-weight: normal; }

  /* ---------- 底部统计 ---------- */
  .footbar {
    position: fixed; bottom: 3.2vh; left: 0; right: 0; z-index: 5;
    text-align: center; font-size: clamp(10px, 1.4vw, 12.5px);
    color: #5f6f88; letter-spacing: .32em; text-indent: .32em; pointer-events: none;
  }
  .footbar b { color: #9a8657; font-weight: normal; }

  /* ---------- 详情卡 ---------- */
  .panel {
    position: fixed; z-index: 10;
    top: 0; bottom: 0; right: 0; width: min(520px, 100vw);
    background: linear-gradient(160deg, rgba(13,20,36,.94) 0%, rgba(7,11,20,.96) 100%);
    border-left: 1px solid rgba(216,184,119,.28);
    transform: translateX(102%);
    transition: transform .7s cubic-bezier(.22,.9,.24,1);
    overflow-y: auto; overscroll-behavior: contain;
    box-shadow: -30px 0 90px rgba(0,0,0,.6);
    -webkit-overflow-scrolling: touch;
  }
  body.detail-open .panel { transform: translateX(0); }
  .panel-inner { padding: 40px 38px 60px; }
  .closebtn {
    position: sticky; top: 14px; float: right;
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid rgba(216,184,119,.4); background: rgba(0,0,0,.3);
    color: #d8b877; font-size: 17px; line-height: 36px; text-align: center;
    cursor: pointer; font-family: sans-serif; z-index: 2;
  }
  .closebtn:active { transform: scale(.94); }

  .p-rank { font-size: 12px; letter-spacing: .4em; color: #8798b3; margin-bottom: 6px; }
  .p-name {
    font-size: 92px; line-height: 1.05; font-weight: 600;
    background: linear-gradient(180deg, #f7ecd0 0%, #d8b877 60%, #b3873f 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 60px rgba(216,184,119,.18);
  }
  .p-junwang {
    display: inline-block; margin-top: 12px; padding: 5px 16px;
    border: 1px solid rgba(216,184,119,.45); border-radius: 999px;
    font-size: 13px; letter-spacing: .24em; text-indent: .24em; color: #d8bc85;
  }
  .p-story {
    margin-top: 26px; font-size: 15.5px; line-height: 2.05; color: #c9d2e2;
    text-align: justify;
  }
  .p-story::first-letter { color: #e6cf9a; font-size: 1.2em; }

  .sect { margin-top: 34px; }
  .sect-title {
    display: flex; align-items: center; gap: 14px;
    font-size: 13px; letter-spacing: .42em; color: #9a8657; margin-bottom: 18px;
  }
  .sect-title::before, .sect-title::after {
    content: ""; height: 1px; flex: 1;
    background: linear-gradient(90deg, transparent, rgba(216,184,119,.4));
  }
  .sect-title::after { background: linear-gradient(90deg, rgba(216,184,119,.4), transparent); }

  /* 迁徙时间线 */
  .mig { list-style: none; }
  .mig li {
    position: relative; padding: 0 0 22px 30px;
    border-left: 1px solid rgba(216,184,119,.25);
    margin-left: 8px;
  }
  .mig li:last-child { padding-bottom: 4px; }
  .mig li::before {
    content: ""; position: absolute; left: -5px; top: 7px;
    width: 9px; height: 9px; border-radius: 50%;
    background: #d8b877; box-shadow: 0 0 14px rgba(216,184,119,.9);
  }
  .mig .era { font-size: 12.5px; color: #d8bc85; letter-spacing: .2em; margin-bottom: 5px; }
  .mig .evt { font-size: 14.5px; line-height: 1.85; color: #b6c1d4; }

  /* 名人堂 */
  .celebs { display: flex; flex-wrap: wrap; gap: 10px; }
  .celeb {
    padding: 8px 18px; border-radius: 10px;
    background: rgba(216,184,119,.07);
    border: 1px solid rgba(216,184,119,.22);
    font-size: 14px; color: #dfd0ac; letter-spacing: .05em;
  }
  .celeb small { display: block; font-size: 11px; color: #8794ab; margin-top: 3px; letter-spacing: .12em; }

  .p-footer {
    margin-top: 42px; padding-top: 22px;
    border-top: 1px dashed rgba(216,184,119,.25);
    font-size: 12.5px; line-height: 2; color: #6d7d95; text-align: center; letter-spacing: .08em;
  }
  .p-footer em { font-style: normal; color: #c8ab6d; }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 24vh; transform: translateX(-50%) translateY(8px);
    padding: 10px 26px; border-radius: 999px; z-index: 20;
    background: rgba(10,16,30,.9); border: 1px solid rgba(216,184,119,.4);
    color: #e6d5ab; font-size: 13.5px; letter-spacing: .14em;
    opacity: 0; pointer-events: none; transition: all .4s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* loading */
  #boot {
    position: fixed; inset: 0; z-index: 99; display: flex; align-items: center; justify-content: center;
    background: #030509; color: #d8b877; letter-spacing: .5em; text-indent: .5em;
    font-size: 15px; transition: opacity 1s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }

  @media (max-width: 640px) {
    .panel { width: 100vw; border-left: none; }
    .panel-inner { padding: 30px 26px 50px; }
    .p-name { font-size: 72px; }
    .searchwrap { bottom: 15vh; }
  }
</style>
</head>
<body>

<div id="boot">星河载入中</div>
<canvas id="starfield"></canvas>
<canvas id="sky"></canvas>

<div class="masthead">
  <div class="sub">百家姓 · 三千年迁徙史诗</div>
  <h1>来时路</h1>
  <div class="tagline">你的姓，是一条走了三千年的路</div>
</div>

<div class="searchwrap">
  <div class="searchbox">

    <input id="q" type="text" maxlength="2" placeholder="输入你的姓，例如：陈" autocomplete="off">

</div>

<div class="footbar">VIBE CODING · <b>百家姓星河计划</b> · 每颗星，都是一部家族史诗</div>

<aside class="panel" id="panel">
  <div class="panel-inner">
    <div class="closebtn" onclick="closePanel()">✕</div>

</aside>

<script>
/* ================= 姓氏数据（起源 · 郡望 · 迁徙 · 名人） ================= */
const CLANS = [
{name:"李",rank:1,origin:"陇西成纪（今甘肃天水）",junwang:"陇西堂",story:"嬴姓之后。商末，理征直谏获罪，其子利贞逃难于伊侯之墟，靠食木子（李树果实）活了下来，遂改『理』为『李』——这个姓氏的骨子里，长着一棵救命的树。",mig:[["先秦","发迹陇西，老子李耳著五千言，骑青牛出函谷关，为得姓后第一位圣贤"],["唐","李唐开国，为国姓。宗室分封、功臣赐姓，李姓如星火燎原，撒遍九州"],["唐末","固始李氏随王审知兄弟入闽；宋末李火德南迁，被闽粤客家人尊为『入闽始祖』"],["明清","湖广填四川、闽粤下南洋，李姓渡海谋生，从此四海有李"]],famous:[["李耳","道家始祖·老子"],["李白","诗仙"],["李世民","唐太宗"],["李清照","千古第一才女"]]},
{name:"王",rank:2,origin:"太原（今山西太原）",junwang:"太原堂 · 琅琊堂",story:"王即『帝王之后』。姬姓之王出自周灵王太子晋，子姓之王出自商朝王子比干，妫姓之王出自齐王田氏——三个王族，在同一面姓氏大旗下会师。天下王氏，出门皆可称贵胄。",mig:[["先秦","三支王族后裔先后以王为氏，聚于太原、琅琊"],["魏晋","琅琊王氏辅佐东晋，『王与马，共天下』，一门出三十五位宰相"],["唐末","王潮、王审知兄弟率固始义军入闽，闽王开基，王氏成为闽地大姓"],["宋以降","三槐王氏显于宋，后裔随客家南迁、随移民渡海，遍布南方与海外"]],famous:[["王羲之","书圣"],["王维","诗佛"],["王安石","十一世纪改革家"],["王阳明","心学宗师"]]},
{name:"张",rank:3,origin:"清河（今河北清河）",junwang:"清河堂",story:"黄帝之孙挥，夜观弧星，受启发发明了弓箭，被封为弓正（掌管弓箭的官），遂以『张』为姓——张字拆开，正是一人引弓。这个姓，天生带着瞄准星辰的姿势。",mig:[["先秦","挥公封于青阳（清河），张姓在冀南豫北扎根"],["汉","张良运筹帷幄、张骞凿空西域，张氏声名随丝路远播"],["晋唐","永嘉之乱后南渡，韶州张九龄开大庾岭路，岭南张氏兴起"],["明清","洪洞大槐树移民、闯关东、走西口，张姓填满北方，又下南洋"]],famous:[["张良","谋圣"],["张衡","地动仪发明者"],["张骞","凿空西域第一人"],["张仲景","医圣"]]},
{name:"刘",rank:4,origin:"彭城沛县（今江苏徐州）",junwang:"彭城堂",story:"帝尧后裔。夏代有刘累，为夏王养龙，赐姓御龙氏——刘姓是世界上唯一一个『养过龙』的姓氏。四千年后，他的后人刘邦斩白蛇起义，开创四百年大汉。",mig:[["先秦","刘累之后居于鲁，战国时迁至沛丰邑"],["汉","刘邦定鼎，刘氏宗室封王四方，『遍地刘』自此始"],["两晋","匈奴刘渊建汉，刘姓北上草原；南阳刘氏则南迁浈阳"],["近代","客籍刘氏大批下南洋，潮汕刘氏渡台垦荒，全球刘氏超八千万"]],famous:[["刘邦","汉高祖"],["刘备","蜀汉昭烈帝"],["刘禹锡","诗豪"],["刘徽","古典数学奠基者"]]},
{name:"陈",rank:5,origin:"宛丘（今河南淮阳）",junwang:"颍川堂",story:"舜帝之后。周武王封舜的后裔胡公满于陈国（今淮阳），子孙以国为氏。陈国虽小，却养出了中国人口最多的南方大姓——今天全球九千万陈氏，血脉都可以追到那座小小的宛丘城。",mig:[["春秋","陈完避祸奔齐，改姓田，代齐康公成为战国七雄之一，田氏一支后又复归陈姓"],["东晋","颍川陈氏南迁，成为江南望族"],["唐","陈元光开漳，被尊『开漳圣王』，陈氏成为闽粤第一大姓"],["宋","江州义门陈氏三千七百口同炊共食，屡受旌表，分析天下二百九十一庄，陈姓自此遍布全国"]],famous:[["陈霸先","陈武帝"],["陈元光","开漳圣王"],["陈独秀","新文化运动旗手"],["陈嘉庚","华侨旗帜"]]},
{name:"杨",rank:6,origin:"弘农（今河南灵宝）",junwang:"弘农堂",story:"出自姬姓。周宣王之子尚父封于杨（今山西洪洞），晋国灭杨后，羊舌氏食采于此，其后以杨为氏。『天下杨氏出弘农』——弘农杨氏四世三公，是东汉最显赫的门第。",mig:[["春秋","杨国初封于洪洞，晋灭之，姬姓杨氏散入晋地"],["汉","弘农杨氏四世太尉，『关西孔子』杨震却金暮夜，清白传家"],["隋","杨坚统一天下，杨氏再登国姓，宗室遍布州郡"],["宋明","杨家将满门忠烈名动千古；明代杨氏随军屯垦入黔入滇，客籍杨氏迁闽粤湘赣"]],famous:[["杨震","四知先生"],["杨坚","隋文帝"],["杨万里","南宋四大家"],["杨继盛","铁骨诤臣"]]},
{name:"黄",rank:7,origin:"江夏（今湖北武汉）",junwang:"江夏堂",story:"嬴姓之后，陆终受封于黄国（今河南潢川），子孙以国为氏。黄国被楚所灭后，遗民带着国名流亡四方——如今全球黄氏祠堂，十座有九座写着『江夏堂』：一座消失的古国，成了三千万人的乡愁。",mig:[["春秋","黄国灭于楚，遗民北迁固始"],["战国至汉","春申君黄歇相楚二十余年，黄氏显于江夏"],["晋唐","中原板荡，黄氏南迁入闽，邵武黄峭山公有子二十一人，遣子四方开基，临行作八句认祖诗"],["明清","峭山公后裔遍布闽粤赣，继而大批渡台、下南洋，江夏堂号随之播于四海"]],famous:[["黄歇","战国四公子·春申君"],["黄庭坚","江西诗派之祖"],["黄道婆","棉纺织革新家"],["黄宗羲","中国思想启蒙之父"]]},
{name:"赵",rank:8,origin:"天水（今甘肃天水）",junwang:"天水堂 · 半部堂",story:"造父为周穆王驾车，八骏西游昆仑，徐偃王作乱，造父驾车一日千里助王平叛，受封于赵城，子孙以赵为氏。为这个姓赢得封地的，是一次史诗级的车技。",mig:[["西周","造父封赵城，赵氏兴于晋"],["春秋","赵盾执政，赵氏孤儿存续血脉，三家分晋建赵国"],["宋","赵匡胤陈桥兵变建立宋朝，赵姓国姓，宗室随靖康之变大规模南渡临安"],["宋元","涿郡赵氏与南渡赵氏并立，裔孙散居江南，后迁闽粤，渡海赴台"]],famous:[["赵匡胤","宋太祖"],["赵云","常胜将军"],["赵孟頫","元代书画宗师"],["赵佶","艺术皇帝·宋徽宗"]]},

/* ================= 星空背景 ================= */
(function(){
  const cv = document.getElementById('starfield'), ctx = cv.getContext('2d');
  let W, H, stars = [];
  function resize(){
    W = cv.width = innerWidth * devicePixelRatio;
    H = cv.height = innerHeight * devicePixelRatio;
    cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px';
    stars = [];
    const n = Math.floor(W*H/9000);
    for(let i=0;i<n;i++){
      stars.push({x:Math.random()*W, y:Math.random()*H, r:(Math.random()*1.2+.3)*devicePixelRatio,
        a:Math.random()*.6+.15, tw:Math.random()*Math.PI*2, sp:Math.random()*.02+.005});
    }
  }
  resize(); addEventListener('resize', resize);
  (function loop(){
    ctx.clearRect(0,0,W,H);
    for(const s of stars){
      s.tw += s.sp;
      const a = s.a * (0.55 + 0.45*Math.sin(s.tw));
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7);
      ctx.fillStyle = `rgba(220,230,255,${a})`; ctx.fill();
    }
    requestAnimationFrame(loop);
  })();
})();

/* ================= 姓氏星河 ================= */
const sky = document.getElementById('sky'), sctx = sky.getContext('2d');
let SW, SH, DPR = Math.min(devicePixelRatio||1, 2);
let nodes = [], meteors = [], t = 0;
let hoveredNode = null;

function layout(){
  SW = sky.width = innerWidth * DPR;
  SH = sky.height = innerHeight * DPR;
  sky.style.width = innerWidth+'px'; sky.style.height = innerHeight+'px';
  nodes = CLANS.map((c, i) => {
    // 环形星带布局：中间留空给标题
    const ang = (i / CLANS.length) * Math.PI * 2 + 0.35;
    const rx = (0.30 + 0.235 * ((i * 2654435761) % 1000 / 1000)) * SW;
    const ry = (0.30 + 0.30 * ((i * 40503) % 997 / 997)) * SH;
    const cx = SW/2, cy = SH * 0.52;
    return {
      c, x: cx + Math.cos(ang)*rx*0.92, y: cy + Math.sin(ang)*ry*0.86,
      phase: Math.random()*Math.PI*2, drift: 0.4 + Math.random()*0.8,
      size: (c.rank <= 10 ? 30 : c.rank <= 30 ? 25 : 21) * DPR,
      glow: 0.3 + Math.random()*0.4
    };
  });
}
layout(); addEventListener('resize', layout);

function drawSky(){
  t += 0.016;
  sctx.clearRect(0,0,SW,SH);

  // 底部星云
  const g = sctx.createRadialGradient(SW/2, SH*0.5, 0, SW/2, SH*0.5, SW*0.75);
  g.addColorStop(0, 'rgba(38,52,88,0.20)');
  g.addColorStop(.6, 'rgba(18,26,48,0.08)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  sctx.fillStyle = g; sctx.fillRect(0,0,SW,SH);

  // 流星
  if(Math.random()<0.012 && meteors.length<3){
    meteors.push({x:Math.random()*SW, y:Math.random()*SH*0.4, vx:(Math.random()*3+2)*DPR, vy:(Math.random()*1.5+1)*DPR, life:1});
  }
  for(let i=meteors.length-1;i>=0;i--){
    const m = meteors[i];
    m.x += m.vx; m.y += m.vy; m.life -= 0.008;
    if(m.life<=0){ meteors.splice(i,1); continue; }
    const grad = sctx.createLinearGradient(m.x, m.y, m.x-m.vx*22, m.y-m.vy*22);
    grad.addColorStop(0, `rgba(230,220,190,${.85*m.life})`);
    grad.addColorStop(1, 'rgba(230,220,190,0)');
    sctx.strokeStyle = grad; sctx.lineWidth = 1.4*DPR;
    sctx.beginPath(); sctx.moveTo(m.x, m.y); sctx.lineTo(m.x-m.vx*22, m.y-m.vy*22); sctx.stroke();
  }

  // 姓氏星
  for(const n of nodes){
    n.phase += 0.003 * n.drift;
    const x = n.x + Math.sin(n.phase)*6*DPR, y = n.y + Math.cos(n.phase*0.8)*5*DPR;
    const pulse = 0.75 + 0.25*Math.sin(t*1.4 + n.phase*3);
    const isHover = hoveredNode === n;
    const alpha = isHover ? 1 : (0.42 + 0.5*pulse*n.glow);

    // 光晕
    const rg = sctx.createRadialGradient(x, y, 0, x, y, n.size*1.9);
    rg.addColorStop(0, `rgba(216,184,119,${.34*alpha})`);
    rg.addColorStop(1, 'rgba(216,184,119,0)');
    sctx.fillStyle = rg;
    sctx.beginPath(); sctx.arc(x, y, n.size*1.9, 0, 7); sctx.fill();

    // 核心光点
    sctx.beginPath(); sctx.arc(x, y + n.size*0.72, 2.2*DPR, 0, 7);
    sctx.fillStyle = `rgba(240,225,190,${alpha})`; sctx.fill();

    // 姓氏字
    sctx.font = `${n.size}px "Noto Serif SC","STSong","SimSun",serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.shadowColor = `rgba(216,184,119,${.8*alpha})`;
    sctx.shadowBlur = 16*DPR*(isHover?1.6:1);
    sctx.fillStyle = `rgba(${isHover?'248,236,208':'214,196,158'},${Math.min(1,alpha+.18)})`;
    sctx.fillText(n.c.name, x, y);
    sctx.shadowBlur = 0;

    if(isHover){
      sctx.strokeStyle = 'rgba(216,184,119,.7)';
      sctx.lineWidth = 1*DPR;
      sctx.beginPath(); sctx.arc(x, y + n.size*0.14, n.size*0.95, 0, 7); sctx.stroke();
    }
    n._x = x; n._y = y;
  }
  requestAnimationFrame(drawSky);
}
drawSky();

/* ---------- 命中检测 ---------- */
function nodeAt(px, py){
  for(const n of nodes){
    const dx = px*DPR - n._x, dy = py*DPR - n._y;
    if(Math.abs(dx) < n.size*0.75 && Math.abs(dy) < n.size*0.8) return n;
  }
  return null;
}
sky.addEventListener('mousemove', e => {
  hoveredNode = nodeAt(e.clientX, e.clientY);
  sky.style.cursor = hoveredNode ? 'pointer' : 'default';
});
sky.addEventListener('click', e => {
  const n = nodeAt(e.clientX, e.clientY);
  if(n) openPanel(n.c);
});
// 移动端点按
sky.addEventListener('touchstart', e => {
  const tch = e.touches[0];
  const n = nodeAt(tch.clientX, tch.clientY);
  if(n){ openPanel(n.c); }
}, {passive:true});

/* ================= 详情面板 ================= */
const panel = document.getElementById('panel');
function openPanel(clan){
  document.getElementById('pRank').textContent = `中华第 ${clan.rank} 大姓 · 源起 ${clan.origin}`;
  document.getElementById('pName').textContent = clan.name;
  document.getElementById('pJunwang').textContent = clan.junwang;
  document.getElementById('pStory').textContent = clan.story;
  const mig = document.getElementById('pMig'); mig.innerHTML = '';
  clan.mig.forEach(([era, evt]) => {
    const li = document.createElement('li');
    li.innerHTML = `<div class="era">${era}</div><div class="evt">${evt}</div>`;
    mig.appendChild(li);
  });
  const cel = document.getElementById('pCelebs'); cel.innerHTML = '';
  clan.famous.forEach(([nm, title]) => {
    const d = document.createElement('div'); d.className = 'celeb';
    d.innerHTML = `${nm}<small>${title}</small>`;
    cel.appendChild(d);
  });
  panel.scrollTop = 0;
  document.body.classList.add('detail-open');
  // 触发一次流星雨庆祝
  for(let i=0;i<6;i++){
    meteors.push({x:Math.random()*SW, y:Math.random()*SH*0.5, vx:(Math.random()*3+2)*DPR, vy:(Math.random()*1.5+1)*DPR, life:1});
  }
}
function closePanel(){ document.body.classList.remove('detail-open'); }
addEventListener('keydown', e => { if(e.key === 'Escape') closePanel(); });

/* ================= 搜索 ================= */
const q = document.getElementById('q');
const toast = document.getElementById('toast');
let toastTimer;
function showToast(msg){
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove('show'), 2200);
}
function doSearch(){
  const v = q.value.trim();
  if(!v) return;
  const hit = CLANS.find(c => c.name === v[0]) || CLANS.find(c => v[0] === '肖' && c.name === '肖');
  if(hit){ openPanel(hit); q.value = ''; q.blur(); }
  else showToast(`「${v[0]}」的星还在路上 · 评论区留下你的姓，下期点亮`);
}
q.addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });

/* 随机探索彩蛋：双击星空 */
let lastTap = 0;
sky.addEventListener('click', e => {
  const now = Date.now();
  if(now - lastTap < 320){ // 双击
    const c = CLANS[Math.floor(Math.random()*CLANS.length)];
    openPanel(c);
  }
  lastTap = now;
});

/* boot */
setTimeout(()=>document.getElementById('boot').classList.add('gone'), 700);
</script>
